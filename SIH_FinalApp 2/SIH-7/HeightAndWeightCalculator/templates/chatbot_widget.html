<!-- DeepFit AI Coach - floating chat (included on every page by base.html; /chatbot opens it full screen) -->
<div id="dfc" class="dfc" data-open="false">
    <div class="dfc-teaser" id="dfc-teaser" hidden>Ask me about your results 👋</div>
    <button class="dfc-launcher" id="dfc-launcher" aria-label="Open the DeepFit AI Coach" aria-expanded="false">
        <span class="dfc-ring"></span>
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#fff" d="M12 2l1.9 4.6L18.5 8l-4.6 1.9L12 14.5l-1.9-4.6L5.5 8l4.6-1.4zM19 13l.95 2.3L22.3 16l-2.35.7L19 19l-.95-2.3L15.7 16l2.35-.7zM6 15l1.2 2.8L10 19l-2.8 1.2L6 23l-1.2-2.8L2 19l2.8-1.2z"/></svg>
        <span class="dfc-launch-label">AI Coach</span>
    </button>

    <section class="dfc-window" id="dfc-window" role="dialog" aria-label="DeepFit AI Coach" hidden>
        <header class="dfc-head">
            <div class="dfc-avatar big" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#fff" d="M12 2l1.9 4.6L18.5 8l-4.6 1.9L12 14.5l-1.9-4.6L5.5 8l4.6-1.4zM19 13l.95 2.3L22.3 16l-2.35.7L19 19l-.95-2.3L15.7 16l2.35-.7z"/></svg>
                <i class="dfc-online"></i>
            </div>
            <div class="dfc-title">
                <b>DeepFit AI Coach</b>
                <small id="dfc-model">knows your test results</small>
            </div>
            <div class="dfc-head-btns">
                <button class="dfc-icon" id="dfc-new" title="New chat" aria-label="New chat">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
                </button>
                <button class="dfc-icon" id="dfc-expand" title="Full screen" aria-label="Full screen">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 14H5v5h5v-2H7zm-2-4h2V7h3V5H5zm12 7h-3v2h5v-5h-2zM14 5v2h3v3h2V5z"/></svg>
                </button>
                <button class="dfc-icon" id="dfc-close" title="Close" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </header>

        <div class="dfc-body" id="dfc-body" aria-live="polite">
            <div class="dfc-welcome" id="dfc-welcome">
                <div class="dfc-hero">
                    <div class="dfc-avatar huge" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="38" height="38"><path fill="#fff" d="M12 2l1.9 4.6L18.5 8l-4.6 1.9L12 14.5l-1.9-4.6L5.5 8l4.6-1.4zM19 13l.95 2.3L22.3 16l-2.35.7L19 19l-.95-2.3L15.7 16l2.35-.7zM6 15l1.2 2.8L10 19l-2.8 1.2L6 23l-1.2-2.8L2 19l2.8-1.2z"/></svg>
                    </div>
                    <h3 id="dfc-hello">Hi there 👋</h3>
                    <p>I'm your DeepFit coach. I can read your test results, plan your training, explain your talent profile and look at photos of your form.</p>
                </div>
                <div class="dfc-chips" id="dfc-chips">
                    <button class="dfc-chip" data-q="How am I doing? Summarise my latest test results.">📈 How am I doing?</button>
                    <button class="dfc-chip" data-q="Make me a simple training plan for this week based on my results.">🗓️ Plan my week</button>
                    <button class="dfc-chip" data-q="Which sport suits me best and why?">🏅 Which sport suits me?</button>
                    <button class="dfc-chip" data-q="Explain my Hidden Potential score in simple words.">🧠 My Hidden Potential</button>
                    <button class="dfc-chip" data-q="What should I eat and drink before a fitness test?">🥗 Food before a test</button>
                    <button class="dfc-chip" data-q="How can I score more points in DeepFit Arena?">🎮 Win the Arena</button>
                </div>
            </div>
            <div class="dfc-msgs" id="dfc-msgs"></div>
        </div>

        <div class="dfc-cam" id="dfc-cam" hidden>
            <video id="dfc-video" playsinline muted></video>
            <div class="dfc-cam-btns">
                <button class="dfc-pill" id="dfc-cam-cancel">Cancel</button>
                <button class="dfc-pill primary" id="dfc-cam-snap">📸 Capture</button>
            </div>
        </div>

        <footer class="dfc-foot">
            <div class="dfc-attach" id="dfc-attach" hidden>
                <img id="dfc-attach-img" alt=""><span id="dfc-attach-name"></span>
                <button class="dfc-x" id="dfc-attach-x" aria-label="Remove attachment">×</button>
            </div>
            <div class="dfc-compose">
                <div class="dfc-tools">
                    <label class="dfc-tool" title="Attach a photo or file" aria-label="Attach a photo or file">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6z"/></svg>
                        <input type="file" id="dfc-file" hidden accept="image/*,.txt,.csv,.json,.md,.pdf">
                    </label>
                    <button class="dfc-tool" id="dfc-camera" title="Take a photo" aria-label="Take a photo">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2z"/></svg>
                    </button>
                    <button class="dfc-tool" id="dfc-mic" title="Speak" aria-label="Speak your question">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
                    </button>
                </div>
                <textarea id="dfc-input" rows="1" placeholder="Ask your coach anything…" aria-label="Your message"></textarea>
                <button class="dfc-send" id="dfc-send" aria-label="Send" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M3.4 20.4 21 12 3.4 3.6 3.39 10 15 12 3.39 14z"/></svg>
                </button>
            </div>
            <div class="dfc-foot-row">
                <div class="dfc-langs" role="group" aria-label="Reply language">
                    <button class="dfc-lang on" data-lang="en">EN</button>
                    <button class="dfc-lang" data-lang="hi">हिं</button>
                    <button class="dfc-lang" data-lang="te">తె</button>
                </div>
                <span class="dfc-note">AI can make mistakes · not medical advice</span>
            </div>
        </footer>
    </section>
</div>

<style>
#dfc { --c1: #22d3ee; --c2: #8b5cf6; --bg: #0b1220; --panel: #111a2e; --line: #23314f; --text: #e9eefc; --muted: #93a3c4;
       position: fixed; right: 22px; bottom: 22px; z-index: 2147483000; font-family: 'Montserrat', 'Inter', system-ui, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif; }
#dfc *, #dfc *::before, #dfc *::after { box-sizing: border-box; }
#dfc [hidden] { display: none !important; }
#dfc button { font-family: inherit; }
.dfc-launcher { position: relative; display: flex; align-items: center; gap: 0; height: 64px; min-width: 64px; padding: 0 17px; border: 0; border-radius: 999px;
                background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; cursor: pointer; box-shadow: 0 10px 30px rgba(139, 92, 246, .45);
                transition: transform .2s, box-shadow .2s, gap .25s; }
.dfc-launcher:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 36px rgba(34, 211, 238, .5); gap: 10px; }
.dfc-launch-label { max-width: 0; overflow: hidden; white-space: nowrap; font-weight: 800; font-size: 15px; transition: max-width .3s; }
.dfc-launcher:hover .dfc-launch-label, .dfc-launcher:focus-visible .dfc-launch-label { max-width: 120px; }
.dfc-ring { position: absolute; inset: -6px; border-radius: 999px; border: 2px solid rgba(34, 211, 238, .6); animation: dfc-ring 2.2s ease-out infinite; pointer-events: none; }
@keyframes dfc-ring { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
.dfc-teaser { position: absolute; right: 0; bottom: 78px; white-space: nowrap; background: #fff; color: #111827; font-weight: 700; font-size: 14px;
              padding: 10px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: dfc-pop .35s ease-out; }
#dfc[data-open="true"] .dfc-launcher, #dfc[data-open="true"] .dfc-teaser { display: none; }

.dfc-window { position: absolute; right: 0; bottom: 0; width: 410px; height: min(680px, calc(100vh - 44px)); display: flex; flex-direction: column;
              background: radial-gradient(120% 60% at 100% 0%, rgba(139,92,246,.18), transparent 60%), radial-gradient(90% 50% at 0% 100%, rgba(34,211,238,.12), transparent 60%), var(--bg);
              color: var(--text); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55);
              transform-origin: bottom right; animation: dfc-open .28s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes dfc-open { from { transform: scale(.85) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes dfc-pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
#dfc.full { inset: 0; right: 0; bottom: 0; }
#dfc.full .dfc-window { position: fixed; inset: 0; width: 100vw; height: 100vh; border-radius: 0; }
#dfc.full .dfc-body, #dfc.full .dfc-foot { width: 100%; max-width: 860px; margin: 0 auto; }

.dfc-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-bottom: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(34,211,238,.16), rgba(139,92,246,.16)); }
.dfc-avatar { position: relative; flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
              background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 4px 14px rgba(139,92,246,.4); }
.dfc-avatar.big { width: 44px; height: 44px; }
.dfc-avatar.huge { width: 72px; height: 72px; margin: 0 auto 10px; animation: dfc-float 3s ease-in-out infinite; }
@keyframes dfc-float { 50% { transform: translateY(-6px); } }
.dfc-online { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid var(--bg); }
.dfc-title { flex: 1; min-width: 0; line-height: 1.2; }
.dfc-title b { display: block; font-size: 16px; }
.dfc-title small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dfc-head-btns { display: flex; gap: 4px; }
.dfc-icon { width: 36px; height: 36px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.dfc-icon:hover { background: rgba(255,255,255,.08); color: #fff; }

.dfc-body { flex: 1; overflow-y: auto; padding: 16px 14px 8px; scroll-behavior: smooth; }
.dfc-body::-webkit-scrollbar { width: 6px; } .dfc-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
.dfc-hero { text-align: center; padding: 10px 8px 4px; }
.dfc-hero h3 { margin: 0 0 6px; font-size: 22px; font-weight: 800; color: #fff; }
.dfc-hero p { margin: 0 auto; max-width: 320px; color: var(--muted); font-size: 14px; line-height: 1.5; }
.dfc-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.dfc-chip { text-align: left; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
            font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color .15s, transform .15s, background .15s; }
.dfc-chip:hover { border-color: var(--c1); background: #14223b; transform: translateY(-1px); }

.dfc-row { display: flex; gap: 8px; margin: 12px 0; align-items: flex-end; animation: dfc-in .25s ease-out; }
@keyframes dfc-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.dfc-row.user { justify-content: flex-end; }
.dfc-bubble { max-width: 82%; padding: 11px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.55; word-wrap: break-word; overflow-wrap: anywhere; }
.dfc-row.bot .dfc-bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.dfc-row.user .dfc-bubble { background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 6px 16px rgba(99,102,241,.3); }
.dfc-row.err .dfc-bubble { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.45); color: #fecaca; }
.dfc-bubble ul, .dfc-bubble ol { margin: 6px 0 6px 18px !important; padding: 0; }
.dfc-bubble li { margin: 3px 0; }
.dfc-bubble strong { color: #fff; }
.dfc-row.bot .dfc-bubble strong { color: #7dd3fc; }
.dfc-bubble code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 6px; font-size: 13px; }
.dfc-bubble img { display: block; max-width: 100%; max-height: 180px; border-radius: 12px; margin-bottom: 6px; }
.dfc-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-size: 11px; color: var(--muted); }
.dfc-row.user .dfc-meta { justify-content: flex-end; }
.dfc-mini { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 6px; font-size: 12px; }
.dfc-mini:hover { color: #fff; background: rgba(255,255,255,.08); }
.dfc-col { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
.dfc-row.user .dfc-col { align-items: flex-end; }
.dfc-typing { display: inline-flex; gap: 5px; align-items: center; }
.dfc-typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--c1); animation: dfc-bounce 1.2s infinite; }
.dfc-typing i:nth-child(2) { animation-delay: .15s; background: #60a5fa; } .dfc-typing i:nth-child(3) { animation-delay: .3s; background: var(--c2); }
.dfc-typing span { margin-left: 6px; color: var(--muted); font-size: 12.5px; }
@keyframes dfc-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .6; } 30% { transform: translateY(-6px); opacity: 1; } }

.dfc-cam { position: absolute; inset: 72px 12px 120px; background: #000; border-radius: 18px; overflow: hidden; z-index: 3; display: flex; flex-direction: column; }
.dfc-cam video { flex: 1; width: 100%; object-fit: cover; transform: scaleX(-1); }
.dfc-cam-btns { display: flex; gap: 8px; justify-content: center; padding: 10px; background: rgba(0,0,0,.6); }
.dfc-pill { border: 1px solid var(--line); background: var(--panel); color: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; }
.dfc-pill.primary { background: linear-gradient(135deg, var(--c1), var(--c2)); border: 0; }

.dfc-foot { padding: 10px 12px 10px; border-top: 1px solid var(--line); background: rgba(11,18,32,.85); }
.dfc-attach { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 6px 8px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; }
.dfc-attach img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
.dfc-attach span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dfc-x { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
.dfc-compose { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
.dfc-compose:focus-within { border-color: var(--c1); box-shadow: 0 0 0 3px rgba(34,211,238,.15); }
.dfc-tools { display: flex; gap: 2px; }
.dfc-tool { width: 36px; height: 36px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.dfc-tool:hover { color: #fff; background: rgba(255,255,255,.07); }
.dfc-tool.rec { color: #fff; background: #ef4444; animation: dfc-rec 1s infinite; }
@keyframes dfc-rec { 50% { box-shadow: 0 0 0 6px rgba(239,68,68,.25); } }
#dfc-input { flex: 1; min-height: 36px; max-height: 130px; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
             font: inherit; font-size: 14.5px; line-height: 1.45; padding: 8px 4px; }
#dfc-input::placeholder { color: #6b7a99; }
.dfc-send { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 14px; border: 0; cursor: pointer; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 6px 16px rgba(139,92,246,.4); transition: transform .15s, opacity .15s; }
.dfc-send:disabled { opacity: .35; cursor: default; box-shadow: none; }
.dfc-send:not(:disabled):hover { transform: scale(1.06); }
.dfc-foot-row { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
.dfc-langs { display: flex; gap: 4px; }
.dfc-lang { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
.dfc-lang.on { background: rgba(34,211,238,.15); border-color: var(--c1); color: #fff; }
.dfc-note { font-size: 11px; color: #6b7a99; }
#dfc button:focus-visible, #dfc label:focus-within { outline: 2px solid #fde047; outline-offset: 2px; }
#dfc textarea:focus, #dfc textarea:focus-visible { outline: none; }

@media (max-width: 520px) {
    #dfc { right: 14px; bottom: 14px; }
    #dfc[data-open="true"] { inset: 0; }
    #dfc[data-open="true"] .dfc-window { position: fixed; inset: 0; width: 100vw; height: 100dvh; border-radius: 0; }
    .dfc-chips { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { #dfc * { animation: none !important; transition: none !important; } }
</style>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const root = $('dfc'), win = $('dfc-window'), msgs = $('dfc-msgs'), body = $('dfc-body'), input = $('dfc-input'), send = $('dfc-send');
    const STORE = 'dfc_chat_v2';
    let attachment = null, busy = false, lang = 'en', camStream = null, rec = null, recording = false;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const BOT_AVATAR = '<div class="dfc-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="#fff" d="M12 2l1.9 4.6L18.5 8l-4.6 1.9L12 14.5l-1.9-4.6L5.5 8l4.6-1.4zM19 13l.95 2.3L22.3 16l-2.35.7L19 19l-.95-2.3L15.7 16l2.35-.7z"/></svg></div>';

    // ---------------------------------------------------------------- open / close
    function open(full) {
        root.dataset.open = 'true'; win.hidden = false; $('dfc-launcher').setAttribute('aria-expanded', 'true');
        $('dfc-teaser').hidden = true;
        if (full) root.classList.add('full');
        setTimeout(() => input.focus(), 50);
        body.scrollTop = body.scrollHeight;
        try { sessionStorage.setItem('dfc_seen', '1'); } catch (e) { /* storage blocked */ }
    }
    function close() {
        root.dataset.open = 'false'; win.hidden = true; root.classList.remove('full'); stopCam();
        $('dfc-launcher').setAttribute('aria-expanded', 'false'); $('dfc-launcher').focus();
    }
    window.DFChat = { open, close };
    $('dfc-launcher').addEventListener('click', () => open(false));
    $('dfc-close').addEventListener('click', close);
    $('dfc-expand').addEventListener('click', () => { root.classList.toggle('full'); body.scrollTop = body.scrollHeight; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && root.dataset.open === 'true') close(); });
    try { if (!sessionStorage.getItem('dfc_seen')) setTimeout(() => { if (root.dataset.open !== 'true') $('dfc-teaser').hidden = false; }, 2500); } catch (e) { /* ignore */ }
    $('dfc-teaser').addEventListener('click', () => open(false));

    // ---------------------------------------------------------------- who am I talking to
    fetch('/api/chatbot/status').then((r) => r.json()).then((d) => {
        if (d.name) $('dfc-hello').textContent = `Hi ${d.name} 👋`;
        $('dfc-model').textContent = d.provider && d.provider !== 'not configured' ? `Powered by ${d.provider}` : 'Coach is offline - add an AI key';
    }).catch(() => {});

    // ---------------------------------------------------------------- messages
    function save() { try { sessionStorage.setItem(STORE, msgs.innerHTML); } catch (e) { /* ignore */ } }
    function restore() {
        try { const h = sessionStorage.getItem(STORE); if (h) { msgs.innerHTML = h; $('dfc-welcome').hidden = !!msgs.children.length; bindRows(msgs); } } catch (e) { /* ignore */ }
    }
    function bindRows(scope) {
        scope.querySelectorAll('[data-act="copy"]').forEach((b) => b.onclick = () => {
            const t = b.closest('.dfc-col').querySelector('.dfc-bubble').innerText;
            navigator.clipboard && navigator.clipboard.writeText(t); b.textContent = '✓ Copied'; setTimeout(() => { b.textContent = '⧉ Copy'; }, 1200);
        });
        scope.querySelectorAll('[data-act="speak"]').forEach((b) => b.onclick = () => {
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(b.closest('.dfc-col').querySelector('.dfc-bubble').innerText);
            u.lang = { en: 'en-IN', hi: 'hi-IN', te: 'te-IN' }[lang]; speechSynthesis.speak(u);
        });
        scope.querySelectorAll('[data-act="retry"]').forEach((b) => b.onclick = () => { b.closest('.dfc-row').remove(); ask(b.dataset.q || ''); });
    }
    function add(kind, html, { model = '', retry = null } = {}) {
        $('dfc-welcome').hidden = true;
        const row = document.createElement('div');
        row.className = 'dfc-row ' + kind;
        const tools = kind === 'bot' ? `<button class="dfc-mini" data-act="copy">⧉ Copy</button><button class="dfc-mini" data-act="speak">🔊 Listen</button>` :
                      kind === 'err' && retry != null ? `<button class="dfc-mini" data-act="retry" data-q="${esc(retry)}">↻ Try again</button>` : '';
        row.innerHTML = (kind !== 'user' ? BOT_AVATAR : '') +
            `<div class="dfc-col"><div class="dfc-bubble">${html}</div><div class="dfc-meta">${model ? esc(model) + ' · ' : ''}${now()} ${tools}</div></div>`;
        msgs.appendChild(row); bindRows(row);
        body.scrollTop = body.scrollHeight; save();
        return row;
    }
    function typing(on) {
        const t = $('dfc-typing');
        if (on && !t) {
            const row = document.createElement('div'); row.className = 'dfc-row bot'; row.id = 'dfc-typing';
            row.innerHTML = BOT_AVATAR + '<div class="dfc-bubble"><span class="dfc-typing"><i></i><i></i><i></i><span>Coach is thinking…</span></span></div>';
            msgs.appendChild(row); body.scrollTop = body.scrollHeight;
        } else if (!on && t) t.remove();
    }
    const langNote = () => ({ hi: '\n\n(Please reply in simple Hindi.)', te: '\n\n(Please reply in simple Telugu.)' }[lang] || '');

    async function ask(text) {
        if (busy) return;
        const file = attachment; attachment = null; $('dfc-attach').hidden = true;
        if (!text && !file) return;
        busy = true; send.disabled = true;
        let userHtml = esc(text || '').replace(/\n/g, '<br>');
        if (file && file.type.startsWith('image/')) userHtml = `<img src="${URL.createObjectURL(file)}" alt="Attached photo" onerror="this.remove()">` + userHtml;
        else if (file) userHtml = `📎 ${esc(file.name)}` + (userHtml ? '<br>' + userHtml : '');
        add('user', userHtml);
        typing(true);
        try {
            let r;
            if (file) {
                const fd = new FormData(), isImg = file.type.startsWith('image/');
                fd.append(isImg ? 'image' : 'file', file, file.name || 'photo.jpg');
                fd.append('message', (text || (isImg ? 'Look at this photo and give me fitness or technique feedback.' : 'Analyse this file.')) + langNote());
                r = await fetch(`/api/chatbot/${isImg ? 'image' : 'file'}`, { method: 'POST', body: fd });
            } else {
                r = await fetch('/api/chatbot/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text + langNote() }) });
            }
            const d = await r.json().catch(() => ({}));
            typing(false);
            if (r.ok && d.response) {
                add('bot', d.response_html || esc(d.response), { model: d.provider });
                if (d.provider) $('dfc-model').textContent = 'Powered by ' + d.provider;
            } else add('err', '⚠️ ' + esc(d.error || 'The coach could not answer.'), { retry: text });
        } catch (e) {
            typing(false);
            add('err', '⚠️ No connection to the DeepFit server. Check your internet and try again.', { retry: text });
        } finally {
            busy = false; updateSend();
        }
    }

    // ---------------------------------------------------------------- composer
    function updateSend() { send.disabled = busy || (!input.value.trim() && !attachment); }
    function grow() { input.style.height = 'auto'; input.style.height = Math.min(130, input.scrollHeight) + 'px'; }
    input.addEventListener('input', () => { grow(); updateSend(); });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!send.disabled) send.click(); }
    });
    send.addEventListener('click', () => { const t = input.value.trim(); input.value = ''; grow(); ask(t); });
    $('dfc-chips').addEventListener('click', (e) => { const b = e.target.closest('.dfc-chip'); if (b) ask(b.dataset.q); });
    $('dfc-new').addEventListener('click', async () => {
        try { await fetch('/api/chatbot/reset', { method: 'POST' }); } catch (e) { /* ignore */ }
        msgs.innerHTML = ''; $('dfc-welcome').hidden = false; save(); input.focus();
    });
    document.querySelectorAll('.dfc-lang').forEach((b) => b.addEventListener('click', () => {
        lang = b.dataset.lang; document.querySelectorAll('.dfc-lang').forEach((x) => x.classList.toggle('on', x === b));
        if (rec) rec.lang = { en: 'en-IN', hi: 'hi-IN', te: 'te-IN' }[lang];
    }));

    function setAttachment(file) {
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) { add('err', '⚠️ That file is larger than 10 MB.'); return; }
        attachment = file; $('dfc-attach').hidden = false; $('dfc-attach-name').textContent = file.name || 'Photo';
        const img = $('dfc-attach-img');
        if (file.type.startsWith('image/')) { img.src = URL.createObjectURL(file); img.hidden = false; } else img.hidden = true;
        updateSend(); input.focus();
    }
    $('dfc-file').addEventListener('change', (e) => { setAttachment(e.target.files[0]); e.target.value = ''; });
    $('dfc-attach-x').addEventListener('click', () => { attachment = null; $('dfc-attach').hidden = true; updateSend(); });
    win.addEventListener('dragover', (e) => { e.preventDefault(); });
    win.addEventListener('drop', (e) => { e.preventDefault(); setAttachment(e.dataTransfer.files[0]); });
    input.addEventListener('paste', (e) => {
        const f = [...(e.clipboardData || {}).files || []].find((x) => x.type.startsWith('image/'));
        if (f) setAttachment(f);
    });

    // camera: live preview, then capture
    function stopCam() { if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null; $('dfc-cam').hidden = true; }
    $('dfc-camera').addEventListener('click', async () => {
        try {
            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            $('dfc-video').srcObject = camStream; await $('dfc-video').play(); $('dfc-cam').hidden = false;
        } catch (e) { add('err', '⚠️ The camera is not available - allow camera access in the browser.'); }
    });
    $('dfc-cam-cancel').addEventListener('click', stopCam);
    $('dfc-cam-snap').addEventListener('click', () => {
        const v = $('dfc-video'), c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob((b) => { stopCam(); setAttachment(new File([b], 'camera-photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.9);
    });

    // voice input (browser speech recognition)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
        rec = new SR(); rec.continuous = false; rec.interimResults = true; rec.lang = 'en-IN';
        rec.onresult = (e) => { input.value = [...e.results].map((r) => r[0].transcript).join(' '); grow(); updateSend(); };
        rec.onend = () => { recording = false; $('dfc-mic').classList.remove('rec'); if (input.value.trim()) send.click(); };
        rec.onerror = () => { recording = false; $('dfc-mic').classList.remove('rec'); };
    }
    $('dfc-mic').addEventListener('click', () => {
        if (!rec) { add('err', '⚠️ Voice input needs Chrome, Edge or Safari.'); return; }
        if (recording) { rec.stop(); return; }
        recording = true; $('dfc-mic').classList.add('rec'); input.value = ''; rec.start();
    });

    restore();
})();
</script>
