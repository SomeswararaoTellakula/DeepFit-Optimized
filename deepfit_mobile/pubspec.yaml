name: deepfit_mobile
description: DeepFit - AI sports talent assessment on the phone (SIH 2025 PS 25073).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # camera + on-device body tracking (33 BlazePose points, same as the website's MediaPipe)
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ">=0.12.0 <1.0.0"
  image: ^4.2.0
  # talking to the DeepFit server (the existing Flask website)
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  # accessibility: voice, tones, keep the screen on during a test
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  # 600 m run timed by the phone: GPS for distance, motion sensor for steps
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1
  # Talent Passport
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
